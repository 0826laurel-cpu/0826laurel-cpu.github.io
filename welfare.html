<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>互动福利中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1C1C1E;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(125% 75% at 50% -15%, rgba(255,138,80,.16), rgba(255,138,80,0) 58%),
        radial-gradient(95% 55% at 100% 0%, rgba(250,140,22,.12), rgba(250,140,22,0) 55%),
        linear-gradient(180deg, #FFF7F4 0%, #FCFCFE 52%, #F5F6FA 100%);
      background-attachment: fixed;
    }
    html { scrollbar-width: none; -ms-overflow-style: none; }
    html::-webkit-scrollbar { display: none; width: 0; height: 0; }
    body { overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
    body::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .welfare-wrap {
      max-width: 430px; margin: 0 auto; min-height: 100vh;
      padding: 24px 20px 80px;
      position: relative; overflow: hidden;
    }

    /* ====== 顶部 Hero（与 me/rebate 同语言：橙红渐变 + 白字 + 流光） ====== */
    .hero {
      background: linear-gradient(135deg, #ff4d4f 0%, #fa8c16 100%);
      border-radius: 24px;
      color: #fff;
      padding: 26px 24px;
      box-shadow: 0 8px 24px rgba(255,77,79,.16);
      position: relative;
      overflow: hidden;
      margin: 0 2px 18px;
      animation: heroGlow 4.4s ease-in-out infinite;
    }
    .hero::after {
      content: ""; position: absolute;
      right: -40px; top: -50px;
      width: 160px; height: 160px;
      background: rgba(255,255,255,.15); border-radius: 50%; filter: blur(8px);
    }
    .hero::before {
      content: ""; position: absolute;
      top: 0; left: -60%; width: 55%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.30), transparent);
      transform: skewX(-18deg);
      animation: heroSheen 6.5s ease-in-out infinite;
      pointer-events: none;
    }
    .hero h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: 0.4px; color: #fff; line-height: 1.35; }
    .hero p  { margin: 4px 0 0; font-size: 13px; opacity: .94; line-height: 1.85; max-width: 296px; }
    .hero p:first-of-type { margin-top: 12px; }
    .hero .live {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11.5px; margin-top: 14px;
      background: rgba(255,255,255,.22); padding: 5px 12px;
      border-radius: 999px; color: #fff; letter-spacing: 0.2px;
      backdrop-filter: blur(6px);
    }
    .hero .dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: wPulse 1.4s infinite; }
    @keyframes heroGlow {
      0%,100% { box-shadow: 0 8px 24px rgba(255,77,79,.16), 0 0 0 rgba(255,77,79,0); }
      50%     { box-shadow: 0 10px 30px rgba(255,77,79,.30), 0 0 28px rgba(255,77,79,.20); }
    }
    @keyframes heroSheen {
      0% { left: -60%; } 55% { left: 130%; } 100% { left: 130%; }
    }
    @keyframes wPulse {
      0% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: .3; transform: scale(.8); }
    }

    /* ====== 玻璃卡（与 me.html / rebate 完全一致） ====== */
    .me-card {
      background: rgba(255,255,255,.86);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border: .5px solid rgba(20,20,30,.06);
      border-radius: 20px;
      padding: 20px 20px;
      box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 10px 28px rgba(16,24,40,.06);
      margin: 0 2px 16px;
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }
    /* 标题 —— 橙红渐变短柱呼吸（与 me.html 一致：barBreathe） */
    .block-title {
      font-size: 17px; font-weight: 800;
      color: #1C1C1E; letter-spacing: -0.01em;
      margin: 0 0 14px;
      display: flex; align-items: baseline; gap: 8px;
    }
    .block-title::before {
      content: "";
      align-self: center; flex-shrink: 0;
      width: 4px; height: 16px; border-radius: 2.5px;
      background: linear-gradient(180deg, #ff7a45 0%, #f5222d 100%);
      box-shadow: 0 1px 3px rgba(245,34,45,.30);
      animation: wBar 3s ease-in-out infinite;
    }
    @keyframes wBar {
      0%,100% { opacity: .82; box-shadow: 0 1px 3px rgba(245,34,45,.25); }
      50%     { opacity: 1;   box-shadow: 0 1px 9px rgba(245,34,45,.55); }
    }

    /* ====== 签到 ====== */
    .checkin-card .ck-row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    .checkin-card .ck-points { font-size: 32px; font-weight: 800; color: #f5222d; letter-spacing: -0.01em; font-feature-settings: "tnum" 1; }
    .checkin-card .ck-points span { font-size: 14px; font-weight: 500; color: #9AA0AD; margin-left: 2px; }
    .checkin-card .ck-streak { font-size: 13px; color: #6B7280; margin-top: 4px; }
    .checkin-card .ck-done {
      font-size: 13px; font-weight: 700; color: #2BB673;
      background: #E7F7EE; border: 1px solid #BFE9CF;
      border-radius: 999px; padding: 9px 16px;
    }
    .btn-checkin {
      font-size: 14px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, #ff7a45, #f5222d);
      border: none; border-radius: 999px; padding: 10px 22px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(245,34,45,.30);
      position: relative; overflow: hidden;
      transition: transform .15s ease, box-shadow .25s ease;
    }
    .btn-checkin:active { transform: scale(.97); }
    @media (hover:hover) {
      .btn-checkin:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(245,34,45,.40); }
    }
    /* 流光（与 me/rebate 同款 .btn::after 逻辑） */
    .btn-checkin::after {
      content: ""; position: absolute; top: 0; left: -120%; width: 55%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
      transform: skewX(-20deg); animation: wShine 3.6s ease-in-out infinite; pointer-events: none;
    }
    .checkin-card .redeem-title { font-size: 13px; font-weight: 700; color: #444; margin: 20px 0 10px; }
    .checkin-card .redeem-list { display: flex; flex-direction: column; gap: 10px; }
    .checkin-card .rd {
      display: flex; align-items: center; gap: 12px;
      background: #fff; border: 1px solid #F0F1F4; border-radius: 14px;
      padding: 10px 12px; box-shadow: 0 2px 8px rgba(16,24,40,.04);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }
    .checkin-card .rd .rd-img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #FAFBFC; border: 1px solid #F0F1F4; }
    .checkin-card .rd .rd-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .checkin-card .rd .rd-name { font-size: 14px; font-weight: 700; color: #1C1C1E; }
    .checkin-card .rd .rd-sub { font-size: 12px; color: #9AA0AD; }
    .checkin-card .rd .rc {
      align-self: flex-start;
      font-size: 12px; font-weight: 800; color: #fff;
      background: linear-gradient(135deg, #ff7a45, #f5222d);
      border-radius: 999px; padding: 4px 10px; margin-top: 2px;
      box-shadow: 0 2px 6px rgba(245,34,45,.25);
    }
    .checkin-card .rd:active { background: #FFF7F4; }
    .checkin-card .ck-tip { font-size: 11px; color: #B4B2A9; margin-top: 12px; line-height: 1.6; }
    @media (hover:hover) {
      .checkin-card .rd:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(245,34,45,.14); border-color: rgba(245,34,45,.18); }
    }

    /* ====== 邀请 ====== */
    .invite-card .invite-desc { font-size: 13px; color: #6B7280; line-height: 1.75; margin: 0 0 14px; }
    .invite-card .invite-code-box {
      display: flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #FFF7F4, #FFF1E9);
      border: 1px dashed #FFD0B8;
      border-radius: 14px; padding: 14px;
    }
    .invite-card .ic-code { font-size: 18px; font-weight: 800; letter-spacing: 1px; color: #f5222d; flex: 1; font-feature-settings: "tnum" 1; }
    .btn-copy {
      font-size: 13px; font-weight: 700; color: #f5222d;
      background: #fff; border: 1px solid #FFD9D2;
      border-radius: 999px; padding: 8px 14px;
      cursor: pointer; transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .btn-copy:active { background: #FFEAE5; }
    @media (hover:hover) {
      .btn-copy:hover { background: #FFEAE5; border-color: #f5222d; }
    }
    .invite-card .invite-stat { font-size: 12px; color: #888; margin-top: 12px; }
    .invite-card .invite-stat b { color: #f5222d; font-weight: 800; }

    /* ====== 图鉴入口 ====== */
    .guide-entry {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 14px 6px 16px;
    }
    .guide-entry .block-title { margin: 0 0 12px; }
    .guide-entry .guide-desc {
      font-size: 13px; color: #6B7280;
      line-height: 1.7; margin: 0 0 18px;
    }
    .btn-guide {
      display: inline-block; padding: 13px 30px; border-radius: 14px;
      background: linear-gradient(135deg, #ff7a45, #f5222d); color: #fff;
      font-size: 15px; font-weight: 800; text-decoration: none; letter-spacing: 1px;
      box-shadow: 0 10px 24px rgba(245,34,45,.32);
      position: relative; overflow: hidden;
      transition: transform .15s ease, box-shadow .25s ease;
    }
    .btn-guide:active { transform: scale(.97); }
    @media (hover:hover) {
      .btn-guide:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(245,34,45,.40); }
      .btn-guide:hover::after { animation-duration: 2.6s; }
    }
    .btn-guide::after {
      content: ""; position: absolute; top: 0; left: -120%; width: 55%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
      transform: skewX(-20deg); animation: wShine 4.2s ease-in-out infinite; pointer-events: none;
    }
    @keyframes wShine { 0% { left: -120%; } 50% { left: 135%; } 100% { left: 135%; } }

    /* ====== 全局收尾 ====== */
    .note { text-align: center; font-size: 11px; color: #b9bcc6; margin-top: 16px; }
    .err { text-align: center; padding: 60px 16px; }
    .err .em { font-size: 50px; margin-bottom: 14px; }
    .err h1 { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
    .err .lead { font-size: 13px; color: #9AA0AD; margin-bottom: 4px; }

    /* 玻璃卡悬停上浮（与 me.html 同款） */
    @media (hover:hover) and (pointer: fine) {
      .me-card:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(16,24,40,.06), 0 18px 42px rgba(16,24,40,.10); border-color: rgba(245,34,45,.22); }
    }
  </style>
</head>
<body>
  <div class="welfare-wrap" id="app">
    <div class="err" id="err" style="display:none">
      <div class="em">🔒</div>
      <h1>链接无效</h1>
      <p class="lead">请通过福利派送官发给你的专属链接访问本页</p>
    </div>
  </div>

  <script src="config.js?v=5"></script>
  <script src="js/api.js?v=41"></script>
  <script src="js/welfare.js?v=18"></script>
  <script>
  (function(){
    let lastH = 0;
    function report(){
      if(window.parent===window) return;
      const h = document.body.scrollHeight;
      if (Math.abs(h - lastH) <= 2) return;
      lastH = h;
      window.parent.postMessage({type:'setHeight',page:'welfare',height:h},'*');
    }
    window.addEventListener('load',report);
    window.addEventListener('resize',report);
    if ('ResizeObserver' in window) {
      var ro = new ResizeObserver(function(){ report(); });
      ro.observe(document.body);
    } else {
      setInterval(report,800);
    }
    document.addEventListener('visibilitychange',function(){ if(!document.hidden) report(); });
  })();
  </script>
</body>
</html>
