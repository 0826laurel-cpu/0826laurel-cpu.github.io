<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="preconnect" href="https://ecvsamlwjbxovqaziyww.supabase.co" crossorigin>
  <title>模特专属后台</title>
  <!-- 微信收藏 / 分享预览：缩略图 + 标题/描述兜底（运行后会被动态标题覆盖） -->
  <meta property="og:title" content="模特专属后台">
  <meta property="og:description" content="福利派送官亲自寄出的小礼物，智能物流同步，第一时间送达你的专属福利空间。">
  <meta property="og:image" content="https://0826laurel-cpu.github.io/img/share-thumb.jpg">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="900">

  <meta name="description" content="模特专属福利后台：物流查询、福利领取、地址修改，一站式服务。">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1C1C1E; -webkit-font-smoothing: antialiased; background:
        radial-gradient(125% 75% at 50% -15%, rgba(255,138,120,.20), rgba(255,138,120,0) 58%),
        radial-gradient(95% 55% at 100% 0%, rgba(255,99,160,.14), rgba(255,99,160,0) 55%),
        linear-gradient(180deg, #FFF7F4 0%, #FCFCFE 52%, #F5F6FA 100%);
      background-attachment: fixed; }
    .me-wrap { max-width: 430px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .viewport { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 24px 20px 130px; }
    .view { display: none; }
    .view.active { display: block; animation: fadeIn .25s ease; }
    #view-rebate, #view-welfare { margin-left: -20px; margin-right: -20px; }
    @keyframes fadeIn { from { opacity: .6; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .me-card { background: rgba(255,255,255,.86); backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px); border: .5px solid rgba(20,20,30,.06); border-radius: 24px; padding: 22px 20px; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 10px 28px rgba(16,24,40,.06); margin-bottom: 16px; transition: transform .4s cubic-bezier(.2,.7,.3,1), box-shadow .4s ease, border-color .4s ease; }
    .badge { width: 54px; height: 54px; border-radius: 16px; background: linear-gradient(135deg,#FF8A5B,#FF4D7D); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; margin-bottom: 12px; }
    h1 { font-size: 19px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.01em; }
    .lead { font-size: 13px; color: #9AA0AD; margin-bottom: 4px; }
    .block-title {
      font-size: 17px; font-weight: 800; letter-spacing: -0.01em;
      color: #1C1C1E;
      margin: 22px 0 14px;
      display: flex; align-items: baseline; gap: 8px;
    }
    .block-title::before {
      content: "";
      align-self: center; flex-shrink: 0;
      width: 4px; height: 16px; border-radius: 2.5px;
      background: linear-gradient(180deg, #FF8A5B 0%, #FF4D7D 100%);
      box-shadow: 0 1px 3px rgba(255,77,125,.25);
      animation: barBreathe 3s ease-in-out infinite;
    }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: #9AA0AD; margin-bottom: 6px; }
    .field input, .field textarea {
      width: 100%; border: 1px solid #EDEDF0; border-radius: 12px; padding: 11px 12px;
      font-size: 14px; outline: none; background: #FAFBFC; font-family: inherit;
    }
    .field textarea { height: 64px; resize: none; }
    .row2 { display: flex; gap: 10px; }
    .row2 .field { flex: 1; }
    .btn { width: 100%; background: linear-gradient(135deg,#FF8A5B,#FF4D7D); color: #fff; border: none; border-radius: 14px; padding: 13px; font-size: 15px; font-weight: 700; margin-top: 6px; box-shadow: 0 6px 16px rgba(255,77,125,.26); }
    .btn-line { width: 100%; background: transparent; color: #FF4D7D; border: 1px solid #FFD9D2; border-radius: 14px; padding: 12px; font-size: 14px; font-weight: 600; margin-top: 8px; }
    .addr-text { font-size: 13px; line-height: 1.7; color: #20232E; white-space: pre-wrap; }
    .addr-empty { font-size: 13px; color: #9AA0AD; }
    .ship-item { background: #FAFBFC; border: 1px solid #EDEDF0; border-radius: 16px; padding: 14px; margin-bottom: 12px; }
    .ship-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; cursor: pointer; user-select: none; }
    .ship-head .head-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .ship-head .toggle-icon { font-size: 10px; color: #9AA0AD; transition: transform .2s ease; flex-shrink: 0; display: inline-block; width: 12px; }
    .ship-head.collapsed .toggle-icon { transform: rotate(-90deg); }
    .ship-head:hover .toggle-icon { color: #FF4D7D; }
    .ship-item .nm { font-size: 14px; font-weight: 700; flex: 1; }
    .ship-status { display: inline-block; font-size: 11px; font-weight: 600; color: #fff; padding: 3px 10px; border-radius: 12px; flex-shrink: 0; }
    .track { background: #fff; border: 1px dashed #FFD9D2; border-radius: 12px; padding: 12px; margin: 8px 0 4px; }
    .track-label { font-size: 11px; color: #FF4D7D; font-weight: 700; margin-bottom: 6px; }
    .track-row { display: flex; align-items: center; gap: 10px; }
    .track-no { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 16px; font-weight: 700; color: #20232E; letter-spacing: 0.5px; flex: 1; word-break: break-all; }
    .track-copy { background: #FFEAE5; color: #FF4D7D; border: none; border-radius: 10px; padding: 7px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .track-copy:active { background: #FFD9D2; }
    .track-link { display: inline-block; margin-top: 8px; font-size: 12px; color: #5B7CFA; text-decoration: none; }
    .track-date { margin-top: 8px; font-size: 11px; color: #9AA0AD; }
    .track-empty { background: #fff; border: 1px dashed #EDEDF0; border-radius: 12px; padding: 12px; margin: 8px 0; color: #9AA0AD; font-size: 12px; text-align: center; }
    .carrier-label { font-size: 11px; color: #9AA0AD; margin-top: 4px; }
    .tl { margin-top: 12px; padding-top: 8px; border-top: 1px solid #EDEDF0; }
    .tl.collapsed { display: none; }
    .tl .it { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #EDEDF0; }
    .tl .it:last-child { border-bottom: none; }
    .tl .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: 0 0 auto; }
    .tl .tt { font-size: 13px; }
    .tl .ta { font-size: 11px; color: #9AA0AD; margin-top: 2px; }
    .note { text-align: center; font-size: 11px; color: #b9bcc6; margin-top: 16px; }
    .err { text-align: center; padding: 60px 16px; }
    .err .em { font-size: 50px; margin-bottom: 14px; }
    .err-detail { text-align: left; background: #FAFBFC; border: 1px solid #EDEDF0; border-radius: 12px; padding: 12px; font-size: 12px; color: #5A5F6B; margin: 14px 0 0; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }

    /* === 顶部 Hero（橙红渐变 + 白字 + 流光动效，与返款子页同语言） === */
    .hero {
      background: linear-gradient(135deg, #ff4d4f 0%, #fa8c16 100%);
      border-radius: 24px;
      color: #fff;
      padding: 26px 24px;
      box-shadow: 0 8px 24px rgba(255,77,79,.16);
      position: relative;
      overflow: hidden;
      margin: 0 2px 18px;
      animation: heroGlow 4.4s ease-in-out infinite;
    }
    .hero::after {
      content: ""; position: absolute;
      right: -40px; top: -50px;
      width: 160px; height: 160px;
      background: rgba(255,255,255,.15);
      border-radius: 50%;
      filter: blur(8px);
    }
    .hero::before {
      content: ""; position: absolute;
      top: 0; left: -60%;
      width: 55%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.30), transparent);
      transform: skewX(-18deg);
      animation: heroSheen 6.5s ease-in-out infinite;
      pointer-events: none;
    }
    .hero h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: 0.4px; color: #fff; line-height: 1.35; }
    .hero p  { margin: 4px 0 0; font-size: 13px; opacity: .94; line-height: 1.85; max-width: 296px; }
    .hero p:first-of-type { margin-top: 12px; }
    .hero .live {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11.5px; margin-top: 14px;
      background: rgba(255,255,255,.22);
      padding: 5px 12px;
      border-radius: 999px;
      color: #fff;
      letter-spacing: 0.2px;
      backdrop-filter: blur(6px);
    }
    .hero .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.4s infinite;
    }
    @keyframes heroGlow {
      0%,100% { box-shadow: 0 8px 24px rgba(255,77,79,.16), 0 0 0 rgba(255,77,79,0); }
      50%     { box-shadow: 0 10px 30px rgba(255,77,79,.30), 0 0 28px rgba(255,77,79,.20); }
    }
    @keyframes heroSheen {
      0% { left: -60%; }
      55% { left: 130%; }
      100% { left: 130%; }
    }
    @keyframes pulse {
      0%   { opacity: .3; transform: scale(.8); }
      50%  { opacity: 1; transform: scale(1.2); }
      100% { opacity: .3; transform: scale(.8); }
    }
    @keyframes barBreathe {
      0%, 100% { opacity: .82; box-shadow: 0 1px 3px rgba(255,77,125,.25); }
      50%      { opacity: 1;  box-shadow: 0 1px 9px rgba(255,77,125,.55); }
    }
    @keyframes bannerGlow {
      0%, 100% { box-shadow: 0 6px 18px rgba(255,149,0,.10); border-color: rgba(255,149,0,.22); }
      50%      { box-shadow: 0 6px 22px rgba(255,149,0,.22); border-color: rgba(255,149,0,.40); }
    }

    /* === 美化：收件地址卡 === */
    .addr-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 14px; }
    .addr-head .addr-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; color: #20232E; }
    .addr-head .addr-title::before {
      content: ''; display: inline-block; width: 4px; height: 16px;
      background: linear-gradient(180deg,#FF8A5B,#FF4D7D); border-radius: 2px;
    }
    .addr-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    }
    .addr-badge.set { background: rgba(43,182,115,.13); color: #2BB673; }
    .addr-badge.unset { background: rgba(154,160,173,.18); color: #6B7280; }

    .addr-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .addr-row {
      display: flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #FAFBFC, #F6F7F9);
      border: 1px solid #F0F1F4;
      padding: 11px 12px; border-radius: 12px;
    }
    .addr-row .ico {
      width: 28px; height: 28px; border-radius: 9px;
      background: #fff; border: 1px solid #EDEDF0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex: 0 0 auto;
    }
    .addr-row .text { flex: 1; min-width: 0; font-size: 13px; color: #20232E; font-weight: 600; word-break: break-all; }
    .addr-row.full { align-items: flex-start; }
    .addr-row.full .ico { margin-top: 1px; }
    .addr-row.full .text { line-height: 1.55; }

    /* === 首页收件地址：合并为 1 张可点开的卡（v40） === */
    .addr-inline-card {
      background: linear-gradient(135deg,#FAFBFC,#F6F7F9);
      border: 1.5px solid #F0F1F4;
      border-radius: 16px;
      margin-bottom: 12px;
      transition: border-color .2s ease, box-shadow .25s ease, background .25s ease;
      overflow: hidden;
    }
    .addr-inline-card.expanded {
      background: #fff;
      border-color: rgba(255,77,125,.30);
      box-shadow: 0 8px 22px rgba(255,77,125,.10);
    }
    .addr-summary {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 16px;
      cursor: pointer;
      user-select: none;
    }
    .addr-summary:active { transform: scale(.995); }
    .addr-summary .ico {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg,#FFE9DC,#FFD0DB);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex: 0 0 auto;
      box-shadow: 0 2px 8px rgba(255,77,125,.16);
    }
    .addr-summary .summary-text {
      flex: 1; min-width: 0; font-size: 14px; color: #20232E; font-weight: 600;
      line-height: 1.5;
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .addr-summary .summary-text.empty { color: #9AA0AD; font-weight: 500; }
    .addr-summary .arrow {
      font-size: 22px; color: #C7CAD3; flex: 0 0 auto;
      transition: transform .25s ease, color .2s ease;
    }
    .addr-inline-card.expanded .addr-summary .arrow { transform: rotate(90deg); color: #FF4D7D; }
    .addr-form {
      display: none;
      padding: 4px 16px 16px;
      border-top: 1px dashed #EDEDF0;
      margin-top: 0;
    }
    .addr-inline-card.expanded .addr-form { display: block; animation: addrExpand .3s ease; }
    @keyframes addrExpand { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .addr-form .field label { font-size: 12px; color: #6B7280; font-weight: 500; margin-bottom: 4px; }
    .addr-form .field input { padding: 9px 12px; font-size: 13.5px; }
    .addr-form .btn { margin-top: 12px; padding: 12px; font-size: 14px; box-shadow: 0 6px 14px rgba(255,77,125,.24); }

    /* === 收款码（支付宝）模块 === */
    .payout-qr {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed #EDEDF0;
    }
    .payout-qr-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .payout-qr-head .title {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 800; color: #20232E;
    }
    .payout-qr-head .title .em {
      width: 26px; height: 26px; border-radius: 8px;
      background: linear-gradient(135deg,#1677FF,#00B6FF);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
    }
    .payout-qr-head .hint {
      font-size: 11px; color: #9AA0AD; font-weight: 500;
    }
    .payout-qr-body {
      display: flex; align-items: center; gap: 14px;
    }
    .payout-qr-thumb {
      width: 96px; height: 96px; border-radius: 14px;
      border: 1.5px solid #EDEDF0; background: #FAFBFC;
      overflow: hidden; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
    }
    .payout-qr-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .payout-qr-info { flex: 1; min-width: 0; }
    .payout-qr-info .l1 { font-size: 13px; font-weight: 700; color: #20232E; margin-bottom: 4px; }
    .payout-qr-info .l2 { font-size: 11px; color: #9AA0AD; line-height: 1.5; margin-bottom: 10px; }
    .payout-qr-actions { display: flex; gap: 8px; }
    .payout-qr-actions .btn-mini {
      border: 1.5px solid #EDEDF0; background: #fff;
      color: #5A5F6B; font-size: 12px; font-weight: 600;
      padding: 6px 12px; border-radius: 10px; cursor: pointer;
      transition: all .15s ease;
    }
    .payout-qr-actions .btn-mini:hover { border-color: #FF4D7D; color: #FF4D7D; }
    .payout-qr-actions .btn-mini.danger:hover { border-color: #E14E4E; color: #E14E4E; }
    .payout-qr-empty {
      display: flex; align-items: center; gap: 14px;
      background: linear-gradient(135deg, #FFF7EA, #FFEEF3);
      border: 1.5px dashed #FFB6A8;
      border-radius: 14px; padding: 14px;
    }
    .payout-qr-empty .ico {
      width: 56px; height: 56px; border-radius: 14px;
      background: #fff; border: 1px solid #FFE0CB;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; flex: 0 0 auto;
    }
    .payout-qr-empty .text { flex: 1; min-width: 0; }
    .payout-qr-empty .text .l1 { font-size: 13px; font-weight: 700; color: #B83A4E; margin-bottom: 3px; }
    .payout-qr-empty .text .l2 { font-size: 11px; color: #8A4D2E; line-height: 1.5; }
    .payout-qr-empty .btn-up {
      background: linear-gradient(135deg,#FF8A5B,#FF4D7D);
      color: #fff; border: none; border-radius: 12px;
      padding: 10px 16px; font-size: 13px; font-weight: 700;
      cursor: pointer; box-shadow: 0 4px 10px rgba(255,77,125,.26);
      transition: transform .15s ease;
      flex: 0 0 auto;
    }
    .payout-qr-empty .btn-up:active { transform: scale(.97); }
    .payout-qr-uploading { font-size: 12px; color: #FF4D7D; padding: 8px 0; text-align: center; }
    .payout-qr-input { display: none; }

    /* 编辑地址按钮（更现代） */
    .btn-edit {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%;
      background: linear-gradient(135deg, #FF8A5B, #FF4D7D);
      color: #fff; border: none; border-radius: 14px;
      padding: 13px; font-size: 14px; font-weight: 700;
      box-shadow: 0 6px 16px rgba(255,77,125,.26);
      margin-top: 0;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn-edit:active { transform: scale(.98); box-shadow: 0 4px 10px rgba(255,77,125,.3); }
    .btn-edit .arrow { transition: transform .2s ease; }
    .btn-edit:hover .arrow { transform: translateX(3px); }
    /* 已有地址时用次按钮样式（轻盈版） */
    .btn-edit.ghost {
      background: #fff; color: #FF4D7D;
      border: 1px solid #FFD9D2; box-shadow: none;
    }
    .btn-edit.ghost:active { box-shadow: none; }

    /* === 站内通知横幅 === */
    .notify-banner {
      background: rgba(255,247,237,.92);
      border: .5px solid rgba(255,149,0,.22);
      color: #B26A00; font-size: 13px; font-weight: 600; line-height: 1.6;
      border-radius: 16px; padding: 13px 16px; margin-bottom: 14px;
      box-shadow: 0 6px 18px rgba(255,149,0,.10);
      animation: notifyIn .4s ease, bannerGlow 4.2s ease-in-out 1.2s infinite;
    }
    .notify-banner b { color: #FF4D7D; font-size: 15px; }
    @keyframes notifyIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

    /* === 发货商品链接 === */
    .product-link {
      display: inline-flex; align-items: center; gap: 5px;
      margin-top: 8px; font-size: 12px; font-weight: 600;
      color: #FF4D7D; background: #FFEAE5; border: 1px solid #FFD9D2;
      border-radius: 10px; padding: 6px 11px; text-decoration: none;
    }
    .product-link:active { background: #FFD9D2; }

    /* === 福利社群动态（送礼墙） === */
    .wall { background: linear-gradient(160deg, #fff, #FFF7F4); }
    .wall-stats { display: flex; gap: 10px; margin: 4px 0 14px; }
    .wall-stats .ws {
      flex: 1; background: rgba(255,255,255,.72); border: .5px solid rgba(20,20,30,.06);
      border-radius: 16px; padding: 12px 6px; text-align: center;
      box-shadow: 0 2px 8px rgba(16,24,40,.05);
    }
    .wall-stats .ws .n { font-size: 22px; font-weight: 800; color: #FF4D7D; line-height: 1.1; font-feature-settings: "tnum" 1; }
    .wall-stats .ws .l { font-size: 11px; color: #9AA0AD; margin-top: 4px; }
    .wall-feed-wrap { height: 340px; overflow: hidden; position: relative; -webkit-mask-image: linear-gradient(#000 85%, transparent); }
    .wall-feed-track { display: flex; flex-direction: column; animation: wallScroll 28s linear infinite; }
    .wall-feed-wrap:hover .wall-feed-track { animation-play-state: paused; }
    @keyframes wallScroll { from { transform: translateY(0); } to { transform: translateY(-50%); } }
    .wall-feed { display: flex; flex-direction: column; gap: 10px; padding-right: 2px; }
    .wall-item { display: flex; gap: 10px; align-items: flex-start; }
    .wall-item .av {
      width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 14px; font-weight: 700;
    }
    .wall-item .wi-body { flex: 1; min-width: 0; background: #FAFBFC; border: 1px solid #EDEDF0; border-radius: 12px; padding: 9px 11px; }
    .wall-item .wi-text { font-size: 13px; color: #20232E; line-height: 1.5; }
    .wall-item .wi-text b { color: #FF4D7D; }
    .wall-item .wi-meta { font-size: 11px; color: #9AA0AD; margin-top: 3px; }
    .wall-empty { text-align: center; color: #9AA0AD; font-size: 13px; padding: 18px 0; }
    .wall-tip { text-align: center; font-size: 11px; color: #C7A99F; margin-top: 14px; font-weight: 600; }
    .guide-entry { text-align: center; }
    .guide-desc { font-size: 13px; color: #6B7280; line-height: 1.7; margin: 8px 0 16px; }
    .btn-guide {
      display: inline-block; padding: 12px 26px; border-radius: 14px;
      background: linear-gradient(135deg,#FF8A5B,#FF4D7D); color: #fff;
      font-size: 15px; font-weight: 700; text-decoration: none; letter-spacing: 1px;
      box-shadow: 0 10px 24px rgba(255,77,125,.30);
    }
    .btn-guide:active { transform: scale(.97); }

    /* === 我的礼品与物流：列表级折叠（默认显示前 3 条） === */
    .ship-head-row {
      display: flex; flex-wrap: nowrap; align-items: center;
      gap: 10px; user-select: none;
      margin: 22px 0 14px;
    }
    .ship-head-row .block-title {
      flex: 1 1 auto; min-width: 0;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ship-head-row .block-title > span {
      margin-left: 2px;
    }
    .ship-fold-btn {
      flex: 0 0 auto;
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 600; color: #FF4D7D;
      background: #FFF0EC; border: 1px solid #FFD9D2;
      border-radius: 999px; padding: 4px 10px;
      cursor: pointer; transition: background .15s ease, transform .15s ease;
    }
    .ship-fold-btn::after { content: '▼'; font-size: 9px; transition: transform .2s ease; }
    .ship-head-row.expanded .ship-fold-btn::after { transform: rotate(180deg); }
    .ship-fold-btn:active { background: #FFE3DC; transform: scale(.97); }
    @media (hover: hover) and (pointer: fine) {
      .ship-fold-btn:hover { background: #FFE3DC; }
    }
    .ship-extras[hidden] { display: none; }

    /* === 返款进度：列表级折叠（默认显示前 3 笔） === */
    .rp-extras[hidden] { display: none; }
    .rp-toggle-wrap { text-align: center; margin: 6px 0 14px; }
    .rp-toggle-more {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 600; color: #FF4D7D;
      background: #FFF0EC; border: 1px solid #FFD9D2;
      border-radius: 999px; padding: 4px 10px;
      cursor: pointer; transition: background .15s ease;
    }
    .rp-toggle-more::after { content: '▼'; font-size: 9px; transition: transform .2s ease; }
    .rp-toggle-wrap.expanded .rp-toggle-more::after { transform: rotate(180deg); }
    .rp-toggle-more:active { background: #FFE3DC; }

    /* === 专属福利概览 === */
    .overview-card .ov-grid { display: flex; gap: 10px; margin-top: 12px; }
    .overview-card .ov { flex: 1; text-align: center; background: rgba(255,255,255,.72); border: .5px solid rgba(20,20,30,.06); border-radius: 16px; padding: 14px 6px; box-shadow: 0 2px 8px rgba(16,24,40,.05); }
    .overview-card .ov .n { font-size: 22px; font-weight: 700; color: #1C1C1E; font-feature-settings: "tnum" 1; }
    .overview-card .ov .l { font-size: 12px; color: #9AA0AD; margin-top: 4px; }

    /* === iframe 内嵌页（返款 / 福利） === */
    .iframe-wrap {
      width: 100%; height: 500px;
      min-height: 300px;
      border-radius: 18px; overflow: hidden;
      background: #fff; border: .5px solid rgba(20,20,30,.06);
      box-shadow: 0 8px 22px rgba(16,24,40,.06);
      contain: layout paint;
    }
    .iframe-wrap iframe {
      width: 100%; height: 100%; border: none; display: block;
      -webkit-transform: translateZ(0); transform: translateZ(0);
    }

    /* === v30 懒加载骨架（解决两 iframe 并发抢资源导致切 tab 等待 10s+） === */
    .iframe-lazy { position: relative; }
    .iframe-skeleton {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(160deg, #FFF7F4, #fff);
      gap: 12px; z-index: 1; pointer-events: none;
      border-radius: 18px;
    }
    .sk-spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid #FFE3DC; border-top-color: #FF4D7D;
      animation: skSpin 0.8s linear infinite;
    }
    .sk-text { font-size: 13px; color: #9AA0AD; font-weight: 500; }
    @keyframes skSpin { to { transform: rotate(360deg); } }

    /* === 底部 Tab 导航（v40：4 tab + 更显眼：更高 pill + 大图标 + 粗字 + active 渐变填充） === */
    .tabbar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 92px;
      background: rgba(255,255,255,.96); backdrop-filter: blur(14px);
      border-top: .5px solid rgba(20,20,30,.07);
      display: flex; align-items: center; justify-content: center;
      padding: 0 12px 14px; z-index: 30;
    }
    .pill {
      width: 100%; height: 68px; border-radius: 34px;
      border: 1px solid rgba(20,20,30,.08); display: flex;
      background: rgba(255,255,255,.94);
      box-shadow: 0 -6px 24px rgba(16,24,40,.08), inset 0 1px 0 rgba(255,255,255,.6);
      padding: 4px; gap: 2px;
    }
    .tab {
      flex: 1; border-radius: 28px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; color: #9AA0AD; cursor: pointer;
      transition: background .25s cubic-bezier(.2,.7,.3,1), color .2s ease, transform .2s ease, box-shadow .25s ease;
      position: relative;
    }
    .tab.on {
      background: linear-gradient(135deg,#FF8A5B,#FF4D7D);
      color: #fff;
      box-shadow: 0 8px 18px rgba(255,77,125,.36), inset 0 1px 0 rgba(255,255,255,.18);
      animation: tabPop .35s cubic-bezier(.2,.7,.3,1.2);
    }
    @keyframes tabPop {
      from { transform: scale(.92); }
      to { transform: scale(1); }
    }
    .tab .ti { width: 26px; height: 26px; line-height: 1; }
    .tab .tl { font-size: 11.5px; font-weight: 600; margin-top: 0; letter-spacing: .2px; }
    .tab.on .tl { font-weight: 800; color: #fff; }
    .tab.on .ti { filter: drop-shadow(0 1px 1px rgba(255,77,125,.28)); }

    /* === 悬停感应（仅支持指针悬停的设备；手机/touch 不触发，避免乱跳） === */
    @media (hover: hover) and (pointer: fine) {
      .me-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 2px 4px rgba(16,24,40,.06), 0 18px 42px rgba(16,24,40,.10);
        border-color: rgba(255,77,125,.20);
      }
      .tab:not(.on):hover { background: rgba(255,77,125,.07); color: #FF4D7D; transform: translateY(-1px); }
      .tab.on:hover { background: rgba(255,77,125,.18); }
      .btn:hover, .btn-guide:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(255,77,125,.34);
      }
      .btn-edit:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(255,77,125,.34); }
    }
    .me-logout {
      position: fixed; top: 12px; right: 14px; z-index: 60;
      font-size: 12px; color: #fff; text-decoration: none;
      background: rgba(32,35,46,.82); border-radius: 999px;
      padding: 7px 13px; box-shadow: 0 4px 14px rgba(0,0,0,.2);
      backdrop-filter: blur(6px);
      transition: opacity .25s ease, transform .25s ease;
    }
    .me-logout:active { transform: scale(.96); }
    .me-logout.hidden { opacity: 0; transform: translateY(-10px); pointer-events: none; }
  </style>
</head>
<body>
  <div class="me-wrap" id="app">

      <div class="em">🔒</div>

<script src="config.js?v=5"></script>
  <script src="js/api.js?v=43"></script>
  <script src="js/app-page.js?v=47"></script>
  <a class="me-logout" id="me-logout" href="#">退出</a>
  <script>
    (function () {
      var el = document.getElementById('me-logout');
      if (el) el.addEventListener('click', function (e) {
        e.preventDefault();
        try { localStorage.removeItem('p_token'); } catch (err) {}
        location.replace(location.origin + '/join.html');
      });
      // 退出按钮：固定在右上角；向下滚动阅读时自动隐藏，回到顶部时显示，避免遮挡内容
      var vp = document.getElementById('viewport');
      if (el && vp) {
        vp.addEventListener('scroll', function () {
          if (vp.scrollTop > 80) el.classList.add('hidden');
          else el.classList.remove('hidden');
        }, { passive: true });
      }
    })();
  </script>
  <script>
    // 一次性清理：注销任何残留 service worker，防止它拦截并返回旧的 me.js
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(rs){
        rs.forEach(function(r){ r.unregister(); });
      });
      if (window.caches) {
        caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); });
      }
    }
  </script>
