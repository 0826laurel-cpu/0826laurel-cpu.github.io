<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>模特返款公示台</title>
<link rel="stylesheet" href="css/style.css?v=13">
</head>
<body style="overflow:hidden">
<div class="wrap">

  <div class="hero">
    <h1>模特返款公示台</h1>
    <p>每一笔返款，实时公开透明 · 仅展示脱敏信息</p>
    <span class="live"><span class="dot"></span>实时公示中</span>
  </div>

  <div class="main" id="main">

    <!-- 查询模块 -->
    <div class="block query-block">
      <h2>🔍 我是模特，查我的返款</h2>
      <div class="q-box">
        <input id="q-input" type="text" placeholder="输入订单号 或 专属查询码" autocomplete="off">
        <button id="q-btn">查询</button>
      </div>
      <div class="hint">提示：订单号或查询码由对接人提供给你，仅你能查到自己的明细。</div>
      <div id="queryResult"></div>
    </div>

    <!-- 金额累计模块 -->
    <div class="stats" id="stats">
      <div class="stat"><div class="num" id="s-amount">¥0</div><div class="lbl">累计返款金额</div></div>
      <div class="stat"><div class="num" id="s-count">0</div><div class="lbl">已结算笔数</div></div>
      <div class="stat"><div class="num" id="s-model">0</div><div class="lbl">合作模特人数</div></div>
      <div class="stat"><div class="num" id="s-week">¥0</div><div class="lbl">本周新增</div></div>
    </div>

    <!-- 实时返款动态模块 -->
    <div class="block">
      <h2>🔥 实时返款动态 <span class="tag">脱敏</span></h2>
      <div class="feed-wrap"><div class="feed-track" id="feed"></div></div>
    </div>

    <!-- 达人榜模块 -->
    <div class="block">
      <h2>🏆 返款达人榜 <span class="tag">脱敏</span></h2>
      <div id="leaderboard"></div>
    </div>

  </div>

  <div class="foot">
    本页所有公开数据均已脱敏处理，不含任何个人订单与身份信息。<br>
    明细仅本人凭专属码可见，请妥善保管你的查询码。
  </div>

</div>

<script src="../vendor/supabase.js"></script>
<script src="js/config.js?v=6"></script>
<script src="js/app.js?v=21"></script>
<script>
(function(){
  let lastH = 0;
  function report(){
    if(window.parent===window) return;
    const h = document.body.scrollHeight;
    if (Math.abs(h - lastH) <= 2) return;
    lastH = h;
    window.parent.postMessage({type:'setHeight',page:'rebate',height:h},'*');
  }
  window.addEventListener('load',report);
  window.addEventListener('resize',report);
  if ('ResizeObserver' in window) {
    var ro = new ResizeObserver(function(){ report(); });
    ro.observe(document.body);
  } else {
    setInterval(report,800);
  }
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) report(); });
})();
</script>
</body>
</html>
